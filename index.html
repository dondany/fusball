<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cosy Corners</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff6e6; --cream2:#fbe9cc; --ink:#4a3426; --ink2:#7a5d49;
    --tomato:#e8574a; --teal:#2f9e97; --mustard:#f2c14e; --grass:#6fae52;
    --pop: 0 5px 0 rgba(74,52,38,.25);
    --shadow: 0 6px 0 rgba(74,52,38,.16), 0 18px 40px rgba(74,52,38,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#f9d3ad;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
  #app canvas{display:block;touch-action:none}
  button{font-family:inherit}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;left:16px;right:16px;top:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:6px 14px 6px 8px;box-shadow:var(--pop);pointer-events:auto}
  .brand .logo{font-size:28px;display:inline-block;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand .title{font-weight:700;font-size:18px;line-height:1}
  .brand .sub{font-size:13px;color:var(--ink2);margin-top:2px}
  #hint{background:var(--cream);border:3px solid var(--ink);border-radius:999px;box-shadow:var(--pop);padding:8px 18px;font-weight:600;font-size:16px;max-width:min(560px,50vw);text-align:center;pointer-events:auto}
  #hint:empty{visibility:hidden}
  #hint b{color:var(--tomato)}
  #hint.bump{animation:bump .4s}
  @keyframes bump{35%{transform:scale(1.07)}}
  #history{display:flex;gap:4px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:6px 10px;box-shadow:var(--pop);min-height:44px;align-items:center;font-size:18px;max-width:260px;flex-wrap:wrap}
  #history .empty{font-size:13px;color:var(--ink2)}

  /* ---------- dock ---------- */
  #dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:8px;z-index:6;max-width:calc(100% - 160px)}
  #dock:empty{display:none}
  .rp{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:#fff;border-radius:16px;padding:5px 12px 5px 5px;cursor:pointer;color:var(--ink);text-align:left;transition:transform .12s}
  .rp:hover{transform:translateY(-2px)}
  .rp.sel{box-shadow:0 0 0 3px var(--tomato);background:#fff1e6}
  .rp .av{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
  .rp .nm{display:block;font-weight:700;font-size:15px;line-height:1.1}
  .rp .st{display:block;font-size:11px;color:var(--ink2);line-height:1.2;white-space:nowrap}
  .rp.done .nm{color:var(--teal)}
  .dsep{width:2px;align-self:stretch;background:var(--cream2);margin:0 2px}
  .dock-msg{font-weight:600;font-size:15px;padding:0 8px;max-width:440px}
  .dock-msg small{display:block;font-weight:500;color:var(--ink2);font-size:13px}
  .btn{border:3px solid var(--ink);background:#fff;color:var(--ink);font-weight:600;font-size:16px;padding:10px 16px;border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.primary{background:var(--tomato);color:#fff}
  .btn.go{background:var(--teal);color:#fff}
  .btn.small{font-size:14px;padding:6px 10px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.pulse{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .thinking{display:inline-flex;gap:4px;margin-left:6px}
  .thinking i{width:7px;height:7px;background:var(--ink2);border-radius:50%;animation:blink 1s infinite}
  .thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
  @keyframes blink{50%{opacity:.2}}

  /* ---------- radial choice wheel ---------- */
  #radial{position:fixed;left:0;top:0;width:0;height:0;z-index:8;display:none}
  #radial.open{display:block}
  .rbg{position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,230,.55) 45%,rgba(255,246,230,0) 70%);pointer-events:none;animation:fadein .2s}
  @keyframes fadein{from{opacity:0}}
  .rcenter{position:absolute;left:-46px;top:-46px;width:92px;height:92px;border-radius:50%;background:var(--ink);color:#fff;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:cpop .25s cubic-bezier(.2,1.6,.4,1)}
  .rcenter .t{font-weight:700;font-size:15px;line-height:1.05}
  .rcenter .s{font-size:11px;opacity:.85;margin-top:3px}
  .rcenter .x{font-size:10px;opacity:.6;margin-top:2px}
  .rcenter:hover{background:#6b4c39}
  @keyframes cpop{from{transform:scale(.3)}}
  .ropt{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0;transform:translate(var(--x),var(--y));animation:opop .32s cubic-bezier(.2,1.5,.4,1) both;transition:background .1s}
  .ropt .i{font-size:24px;line-height:1}
  .ropt .l{font-size:11px;font-weight:700;margin-top:3px;line-height:1.05;max-width:70px}
  .ropt .e{font-size:10px;font-weight:600;color:var(--ink2);margin-top:1px}
  .ropt:hover{background:var(--mustard)}
  .ropt.cur{background:#fff1c9}
  .ropt.best::after{content:"★";position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--mustard);border:2px solid var(--ink);font-size:13px;display:grid;place-items:center}
  @keyframes opop{from{transform:translate(0,0) scale(.2);opacity:0}}

  /* ---------- labels / bubbles ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
  .tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
  .tag.att{background:#ffe1d9}
  .tag.def{background:#d6f1ee}
  .tag.sel{background:var(--tomato);color:#fff;font-size:14px;padding:3px 10px}
  .tag.pick{pointer-events:auto;cursor:pointer}
  .tag.pick:hover{transform:scale(1.08)}
  .tick{font-size:11px;font-weight:700;color:var(--ink);background:rgba(255,246,230,.85);padding:0 5px;border-radius:6px}
  .eta{font-size:12px;font-weight:700;padding:1px 7px;border-radius:8px;border:2px solid var(--ink);background:#fff}
  .bubble{font-size:16px;font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 12px;animation:bub .3s cubic-bezier(.2,1.8,.4,1);box-shadow:0 3px 0 rgba(74,52,38,.25)}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink)}
  .bubble.def{background:#d6f1ee}
  .bubble.att{background:#ffe1d9}
  .bubble.boom{background:var(--mustard);font-size:22px}
  @keyframes bub{from{transform:scale(.2)}}
  .fade{transition:opacity .4s;opacity:0}

  /* ---------- banner ---------- */
  #banner{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;z-index:7;opacity:0;transition:opacity .3s}
  #banner.show{opacity:1}
  #banner .big{font-size:clamp(48px,11vw,128px);font-weight:700;color:#fff;letter-spacing:.02em;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);line-height:1}
  #banner.show .big{animation:bannerpop .7s cubic-bezier(.2,1.6,.4,1)}
  #banner .small{display:inline-block;margin-top:14px;font-size:clamp(16px,2.4vw,22px);font-weight:600;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:6px 18px;box-shadow:var(--pop)}
  #banner.goal .big{color:var(--mustard)}
  #banner.bad .big{color:#9fd8d2}
  @keyframes bannerpop{0%{transform:scale(.2) rotate(-8deg)}60%{transform:scale(1.1) rotate(2deg)}100%{transform:scale(1)}}
  #replayTag{position:fixed;left:18px;top:84px;z-index:6;font-weight:700;color:#fff;background:var(--tomato);border:3px solid var(--ink);border-radius:10px;padding:3px 10px;display:none;animation:blink 1.2s infinite}

  /* ---------- toolbar ---------- */
  #toolbar{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;z-index:6}
  #toolbar button{width:48px;height:48px;border-radius:14px;border:3px solid var(--ink);background:var(--cream);font-size:22px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
  #toolbar button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#f9d3ad;z-index:20;font-size:26px;font-weight:600;transition:opacity .6s}
  #loading.gone{opacity:0;pointer-events:none}
  #loading span{display:inline-block;animation:bounce 0.8s infinite alternate}
  @keyframes bounce{to{transform:translateY(-14px)}}

  @media (max-width:760px){
    #topbar{flex-wrap:wrap;left:8px;right:8px;top:8px}
    #hint{order:3;flex-basis:100%;max-width:none;font-size:14px;padding:6px 12px}
    #history{max-width:150px;font-size:15px;min-height:38px}
    .brand .title{font-size:16px}
    #dock{left:8px;right:8px;bottom:8px;transform:none;max-width:none;flex-wrap:wrap;justify-content:center;padding:6px}
    .rp{padding:4px 8px 4px 4px}
    .rp .st{display:none}
    .dsep{display:none}
    #toolbar{left:auto;right:8px;bottom:auto;top:118px;flex-direction:column}
    #toolbar button{width:40px;height:40px;font-size:18px}
    #replayTag{top:118px;left:8px}
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<header id="topbar">
  <div class="brand"><span class="logo">⚽</span><div><div class="title">Cosy Corners</div><div class="sub" id="roundInfo">Corner 1 · 0 goals</div></div></div>
  <div id="hint"></div>
  <div id="history"><span class="empty">No corners yet</span></div>
</header>
<div id="dock"></div>
<div id="radial"></div>
<div id="banner"><div class="big"></div><div class="small"></div></div>
<div id="replayTag">● REPLAY</div>
<div id="toolbar">
  <button id="camBtn" title="Switch camera (drag to orbit, scroll to zoom)">🎥</button>
  <button id="muteBtn" title="Sound on/off">🔊</button>
</div>
<div id="loading"><div><span>⚽</span> Rolling out the pitch…</div></div>
<pre id="out" style="display:none"></pre>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const QS=new URLSearchParams(location.search);
const AUTOTEST = parseInt(QS.get('autotest') || '0');
const FIXED = QS.has('fixed');

// =====================================================================
//  Utils
// =====================================================================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
const hyp=(ax,az,bx,bz)=>Math.hypot(ax-bx,az-bz);
const rnd=Math.random;

// =====================================================================
//  Pitch + physics constants (metres, seconds). Goal line is z=0, field is +z.
// =====================================================================
const G=9.81, BALL_R=0.2, GOAL_HW=3.66, GOAL_H=2.44, GOAL_D=2.0, POST_R=0.09;
const TOUCH_X=34, BOX_HW=20.16, BOX_D=16.5, SIX_HW=9.16, SIX_D=5.5, SPOT_Z=11;
const DRAG_K=0.011, SPIN_K=0.16, DT=1/120, HEAD_Y=1.7;
const BALL_SPOT={x:33.4,z:0.55};
const BASE_YAW=Math.atan2(9-BALL_SPOT.z, 0-BALL_SPOT.x);
const TIMINGS=[{label:'Early',d:-0.6},{label:'On the kick',d:0},{label:'Late',d:0.55}];
const GOAL_REF={x:0,z:1.5};

function makeBall(){return{x:BALL_SPOT.x,y:BALL_R,z:BALL_SPOT.z,vx:0,vy:0,vz:0,spin:0,inGoal:false,held:null}}

function kickVel(k){
  const yaw=BASE_YAW-k.dir*Math.PI/180, sp=14+k.power*17, el=k.loft*Math.PI/180;
  return {vx:Math.cos(yaw)*Math.cos(el)*sp, vy:Math.sin(el)*sp, vz:Math.sin(yaw)*Math.cos(el)*sp, spin:-k.curl*SPIN_K};
}

function stepBall(b,dt,ev){
  if(b.held) return;
  const px=b.x,py=b.y,pz=b.z;
  const sp=Math.hypot(b.vx,b.vy,b.vz);
  b.vx+=(-DRAG_K*sp*b.vx + b.spin*b.vz)*dt;
  b.vy+=(-G-DRAG_K*sp*b.vy)*dt;
  b.vz+=(-DRAG_K*sp*b.vz - b.spin*b.vx)*dt;
  b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
  b.spin*=(1-0.15*dt);
  if(b.y<BALL_R){
    b.y=BALL_R;
    if(b.vy<-1.0){ if(ev) ev.push({type:'bounce',speed:-b.vy}); b.vy=-b.vy*0.55; b.vx*=0.85; b.vz*=0.85; b.spin*=0.5; }
    else b.vy=0;
  }
  if(b.y<=BALL_R+1e-4 && b.vy===0){ const f=Math.max(0,1-1.3*dt); b.vx*=f; b.vz*=f; b.spin=0; }
  // posts
  const m=BALL_R+POST_R;
  for(const sx of [-GOAL_HW,GOAL_HW]){
    if(b.y<GOAL_H+POST_R){
      const dx=b.x-sx, dz=b.z, d=Math.hypot(dx,dz);
      if(d<m && d>1e-6){
        const nx=dx/d,nz=dz/d; b.x=sx+nx*m; b.z=nz*m;
        const vn=b.vx*nx+b.vz*nz;
        if(vn<0){ b.vx-=1.7*vn*nx; b.vz-=1.7*vn*nz; if(ev&&-vn>2) ev.push({type:'post'}); }
      }
    }
  }
  // crossbar
  if(Math.abs(b.x)<GOAL_HW){
    const dy=b.y-GOAL_H, dz=b.z, d=Math.hypot(dy,dz);
    if(d<m && d>1e-6){
      const ny=dy/d,nz=dz/d; b.y=GOAL_H+ny*m; b.z=nz*m;
      const vn=b.vy*ny+b.vz*nz;
      if(vn<0){ b.vy-=1.7*vn*ny; b.vz-=1.7*vn*nz; if(ev&&-vn>2) ev.push({type:'bar'}); }
    }
  }
  // goal line crossing
  if(!b.inGoal && pz>=-BALL_R && b.z<-BALL_R && Math.abs(b.x)<GOAL_HW && b.y<GOAL_H){ b.inGoal=true; if(ev) ev.push({type:'goal'}); }
  if(b.inGoal){
    if(b.z<-GOAL_D+BALL_R){ if(ev&&b.vz<-2.5) ev.push({type:'net',x:b.x,y:b.y,power:-b.vz}); b.z=-GOAL_D+BALL_R; b.vz=Math.abs(b.vz)*0.12; b.vx*=0.4; b.vy*=0.5; }
    if(Math.abs(b.x)>GOAL_HW-BALL_R){ b.x=Math.sign(b.x)*(GOAL_HW-BALL_R); b.vx*=-0.2; b.vz*=0.6; }
    if(b.y>GOAL_H-BALL_R){ b.y=GOAL_H-BALL_R; b.vy=-Math.abs(b.vy)*0.2; }
    if(b.z>-BALL_R){ b.z=-BALL_R; b.vz=-Math.abs(b.vz)*0.2; }
  } else if(b.z<0 && b.z>-GOAL_D){
    // roof of the net from above
    if(Math.abs(b.x)<GOAL_HW && py>=GOAL_H+BALL_R && b.y<GOAL_H+BALL_R){ b.y=GOAL_H+BALL_R; b.vy=-b.vy*0.3; b.vx*=0.6; b.vz*=0.6; if(ev) ev.push({type:'roof'}); }
    // side netting from outside
    if(b.y<GOAL_H && Math.abs(px)>=GOAL_HW+BALL_R && Math.abs(b.x)<GOAL_HW+BALL_R){ b.x=Math.sign(b.x)*(GOAL_HW+BALL_R); b.vx*=-0.2; b.vz*=0.5; if(ev) ev.push({type:'sidenet'}); }
  }
}

function predictPath(b0,t0,dur,stride){
  const b={...b0}; const out=[{t:t0,x:b.x,y:b.y,z:b.z,vy:b.vy}];
  let t=t0; const steps=Math.round(dur/DT);
  for(let i=1;i<=steps;i++){
    stepBall(b,DT,null); t+=DT;
    const end=b.inGoal||b.z<-1||Math.abs(b.x)>TOUCH_X+1||b.z>45;
    if(i%stride===0||end) out.push({t,x:b.x,y:b.y,z:b.z,vy:b.vy,end});
    if(end) break;
  }
  return out;
}
function kickPath(k,dur=4.2,stride=6){ const b=makeBall(); Object.assign(b,kickVel(k)); return predictPath(b,0,dur,stride); }
function deliveryPoint(path){
  for(let i=1;i<path.length;i++){
    const a=path[i-1],b=path[i];
    if(a.y>=HEAD_Y && b.y<HEAD_Y && b.vy<0){ const f=(a.y-HEAD_Y)/(a.y-b.y); return {x:lerp(a.x,b.x,f),z:lerp(a.z,b.z,f),y:HEAD_Y,t:lerp(a.t,b.t,f)}; }
  }
  for(const p of path) if(p.t>0.05 && p.y<=BALL_R+0.02) return p;
  return path[path.length-1];
}
function aimVelocity(from,to,speed){
  const dx=to.x-from.x, dy=to.y-from.y, dz=to.z-from.z;
  const T=Math.max(0.12, Math.hypot(dx,dy,dz)/speed);
  const drag=1+DRAG_K*speed*T*0.5;
  return {vx:dx/T*drag, vy:dy/T+0.5*G*T*(1+DRAG_K*speed*T*0.3), vz:dz/T*drag};
}

// =====================================================================
//  Renderer / scene
// =====================================================================
const renderer=new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:FIXED||QS.has('snap')});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
$('#app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
const HORIZON='#fbd6b0';
scene.background=new THREE.Color(HORIZON);
scene.fog=new THREE.Fog(HORIZON,120,320);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,900);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=1.45; controls.minDistance=5; controls.maxDistance=95;

const hemi=new THREE.HemisphereLight('#fff0d8','#7fa35a',1.35); scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffd7a3',2.4);
sun.position.set(38,46,-26); sun.target.position.set(4,0,12);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-46,right:46,top:46,bottom:-46,near:1,far:160});
sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight('#c9dcff',0.45); fill.position.set(-30,20,40); scene.add(fill);

// toon ramp

// crowd (instanced)
const crowd={};
function buildCrowd(STEPS){
  const seats=[];
  for(let i=0;i<STEPS;i++){
    const y=0.5+i*0.75;
    for(let x=-46;x<=42;x+=0.95){ if(rnd()<0.2) continue; seats.push({x:x+(rnd()-.5)*0.3,y,z:-7.6-i*1.3+0.1}); }
    for(let z=-5;z<=62;z+=0.95){ if(rnd()<0.2) continue; seats.push({x:41+i*1.3-0.1,y,z:z+(rnd()-.5)*0.3}); }
  }
  const n=seats.length;
  const bodies=new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.27,0.28,3,8),toon('#ffffff',{}),n);
  const heads=new THREE.InstancedMesh(new THREE.SphereGeometry(0.22,10,8),toon('#ffffff',{}),n);
  const shirts=['#e8574a','#e8574a','#e8574a','#fff3dc','#f2c14e','#ef8f7a','#7cc4bd','#a88bd6','#f49ac1','#2f9e97'];
  const skins=['#f6d2ae','#e8b48a','#c68a5e','#9a6444','#f1c9a0'];
  const c=new THREE.Color();
  seats.forEach((s,i)=>{ bodies.setColorAt(i,c.set(shirts[Math.floor(rnd()*shirts.length)])); heads.setColorAt(i,c.set(skins[Math.floor(rnd()*skins.length)])); s.ph=rnd()*6.28; s.sp=4+rnd()*4; });
  bodies.castShadow=true; scene.add(bodies,heads);
  Object.assign(crowd,{seats,bodies,heads,excite:0.08,target:0.08});
}
const _m4=new THREE.Matrix4();
function updateCrowd(t,dt){
  crowd.excite+= (crowd.target-crowd.excite)*Math.min(1,dt*3);
  const {seats,bodies,heads,excite}=crowd;
  for(let i=0;i<seats.length;i++){
    const s=seats[i]; const b=Math.max(0,Math.sin(t*s.sp+s.ph))*0.4*excite + Math.sin(t*1.3+s.ph)*0.03;
    _m4.makeTranslation(s.x,s.y+0.45+b,s.z); bodies.setMatrixAt(i,_m4);
    _m4.makeTranslation(s.x,s.y+1.0+b,s.z); heads.setMatrixAt(i,_m4);
  }
  bodies.instanceMatrix.needsUpdate=true; heads.instanceMatrix.needsUpdate=true;
}

const labelsEl=$('#labels'); const labels=new Set(); const _pv=new V3();
function addLabel(html,cls,getPos,ttl=Infinity){
  const el=document.createElement('div'); el.className='lbl'; el.innerHTML=`<div class="${cls}" style="position:relative">${html}</div>`;
  labelsEl.appendChild(el); const L={el,getPos,ttl,age:0,visible:true}; labels.add(L); return L;
}
function removeLabel(L){ if(!L) return; L.el.remove(); labels.delete(L); if(L.actor&&L.actor.bubble===L) L.actor.bubble=null; }
function updateLabels(dt){
  const w=innerWidth,h=innerHeight;
  for(const L of labels){
    L.age+=dt;
    if(L.age>L.ttl){ removeLabel(L); continue; }
    if(L.age>L.ttl-0.4 && !L.fading){ L.fading=true; L.el.classList.add('fade'); }
    const p=L.getPos(); _pv.copy(p).project(camera);
    const vis=L.visible && !(L.owner&&L.owner.bubble) && _pv.z<1 && Math.abs(_pv.x)<1.2 && Math.abs(_pv.y)<1.2;
    L.el.style.display=vis?'':'none';
    L.sx=(_pv.x*0.5+0.5)*w; L.sy=(-_pv.y*0.5+0.5)*h; L.vis=vis;
    if(vis && !L.bubble) L.el.style.transform=`translate(${L.sx}px,${L.sy}px) translate(-50%,-100%)`;
  }
  // stack speech bubbles so they don't overlap
  const bs=[...labels].filter(L=>L.bubble&&L.vis).sort((a,b)=>b.sy-a.sy);
  const placed=[];
  for(const L of bs){
    const bw=L.bw||(L.bw=L.el.offsetWidth||120), bh=L.bh||(L.bh=L.el.offsetHeight||34);
    let y=L.sy;
    for(let it=0;it<6;it++){ let hit=false; for(const P of placed){ if(Math.abs(P.x-L.sx)<(P.w+bw)/2+4 && Math.abs(P.y-y)<(P.h+bh)/2+4){ y=P.y-(P.h+bh)/2-6; hit=true; } } if(!hit) break; }
    placed.push({x:L.sx,y,w:bw,h:bh});
    L.el.style.transform=`translate(${L.sx}px,${y}px) translate(-50%,-100%)`;
  }
}

// ---------- CPU defensive planning ----------
const ZONES=[{name:'the near post',x:3.3,z:2.6},{name:'the middle',x:0.3,z:6.8},{name:'the far post',x:-3.4,z:4.2}];
function cpuPlan(r,starts,kick){
  const d=deliveryPoint(kickPath(kick));
  const read={x:clamp(d.x+gauss(r)*2.8,-9,10),z:clamp(d.z+gauss(r)*2.8,1.5,15)};
  const style=pick(r,['man','man','mixed','mixed','zonal']);
  const defs=[null,null,null];
  const greedy=(defIdx,targets,dist)=>{ const used=new Set(); const out={}; const pairs=[]; for(const di of defIdx) for(const ti of targets) pairs.push({di,ti,d:dist(di,ti)}); pairs.sort((a,b)=>a.d-b.d); for(const p of pairs){ if(out[p.di]!==undefined||used.has(p.ti)) continue; out[p.di]=p.ti; used.add(p.ti);} return out; };
  const dd=(di,p)=>hyp(starts.def[di].x,starts.def[di].z,p.x,p.z);
  if(style==='man'){
    const m=greedy([0,1,2],[0,1,2],(di,ti)=>dd(di,starts.att[ti]));
    for(const di in m) defs[di]={type:'mark',target:m[di]};
  } else if(style==='mixed'){
    const danger=[0,1,2].sort((a,b)=>CAST.att[b].reachH-CAST.att[a].reachH).slice(0,2);
    const m=greedy([0,1,2],danger,(di,ti)=>dd(di,starts.att[ti]));
    const zone={...(r()<0.5?ZONES[0]:{name:'the danger zone',x:read.x,z:read.z})};
    for(let di=0;di<3;di++) defs[di]=m[di]!==undefined?{type:'mark',target:m[di]}:{type:'zone',point:zone,zoneName:zone.name};
  } else {
    const zs=ZONES.map(z=>({...z}));
    let best=0; zs.forEach((z,i)=>{ if(hyp(z.x,z.z,read.x,read.z)<hyp(zs[best].x,zs[best].z,read.x,read.z)) best=i; });
    zs[best].x=lerp(zs[best].x,read.x,0.6); zs[best].z=lerp(zs[best].z,read.z,0.6);
    const m=greedy([0,1,2],[0,1,2],(di,zi)=>dd(di,zs[zi]));
    for(const di in m) defs[di]={type:'zone',point:zs[m[di]],zoneName:zs[m[di]].name};
  }
  const keeperPlan=(read.z<6.5?r()<0.7:r()<0.35)?'claim':'stay';
  return {style,defs,keeper:keeperPlan,read};
}

function newSim(plan,starts,seed){
  const S={t:-1.4,rng:mulberry32(seed),ball:makeBall(),kicked:false,phaseId:0,kind:'none',lastTouch:null,lastTouchT:-9,
    events:[],result:null,endT:0,pred:[],shot:null,woodwork:false,done:false,timeScale:1,delivery:null,touches:0,crossY:null,parried:false};
  const k=plan.kick; const kv=kickVel(k);
  const dirH=new V3(kv.vx,0,kv.vz).normalize();
  S.strike={x:BALL_SPOT.x-dirH.x*0.55+dirH.z*0.25,z:BALL_SPOT.z-dirH.z*0.55-dirH.x*0.25};
  kicker.pos.set(KICKER_START.x,0,KICKER_START.z);
  attackers.forEach((a,i)=>{a.pos.set(starts.att[i].x,0,starts.att[i].z);a.plan=plan.att[i];});
  defenders.forEach((a,i)=>{a.pos.set(starts.def[i].x,0,starts.def[i].z);a.plan=plan.def.defs[i];});
  keeper.pos.set(starts.gk.x,0,starts.gk.z); keeper.plan=plan.def.keeper;
  for(const a of everyone){ a.vel.set(0,0,0); a.wp=0; a.attempt=-1; a.mode='play'; a.jumpT=-1; a.action=null; a.actT=0; a.diveT=-1; a.diveSide=0; a.hist=[]; a.screened=false; a.chasing=false; a.isLeader=false; }
  S.delivery=deliveryPoint(kickPath(k));
  return S;
}
function newPhase(S,kind,who){
  S.phaseId++; S.kind=kind; S.lastTouch=who; S.lastTouchT=S.t; S.touches++;
  S.pred=predictPath(S.ball,S.t,3.5,4);
}
function posAt(hist,t){ for(const h of hist) if(h.t>=t) return h; return hist[hist.length-1]; }

function findIntercept(S,a,range,filter){
  for(const p of S.pred){
    if(p.t<=S.t+0.02) continue;
    if(p.y>a.reachH-0.05) continue;
    if(filter&&!filter(p)) continue;
    const d=hyp(p.x,p.z,a.pos.x,a.pos.z); if(d>range) continue;
    if(Math.max(0,d-0.45)<=a.speed*(p.t-S.t)*0.92) return p;
  }
  return null;
}

function decideTarget(S,a){
  const b=S.ball; let tgt={x:a.pos.x,z:a.pos.z}; let mul=1;
  const loose=(S.kind==='cross'||S.kind==='loose')&&!b.held;
  if(S.result){
    if(a.mode==='celebrate'){ const L=S.leader; if(a===L) return {tgt:{x:clamp(L.celebTo.x,-30,30),z:L.celebTo.z},mul:0.9}; return {tgt:{x:L.pos.x+(a.pos.x>L.pos.x?1:-1),z:L.pos.z+1},mul:0.8}; }
    return {tgt,mul:0};
  }
  if(a.role==='kicker'){
    if(!S.kicked){ const f=clamp((S.t+0.75)/0.75,0,1); return {tgt:{x:lerp(KICKER_START.x,S.strike.x,f),z:lerp(KICKER_START.z,S.strike.z,f)},mul:1.2,snap:S.t>-0.75}; }
    return {tgt,mul:0.3};
  }
  if(a.role==='att'){
    const pl=a.plan; const delay=TIMINGS[pl.timing].d;
    if(S.t>=delay && pl.wps.length){
      while(a.wp<pl.wps.length-1 && hyp(a.pos.x,a.pos.z,pl.wps[a.wp].x,pl.wps[a.wp].z)<0.4) a.wp++;
      tgt=pl.wps[a.wp];
    }
    const done=!pl.wps.length || (a.wp===pl.wps.length-1 && hyp(a.pos.x,a.pos.z,tgt.x,tgt.z)<0.6);
    if(pl.role==='screen' && done && S.t>delay){
      let best=null,bd=3.2; for(const d of defenders){ const dd=hyp(d.pos.x,d.pos.z,a.pos.x,a.pos.z); if(dd<bd){bd=dd;best=d;} }
      if(best){ const dl=S.delivery; const vx=dl.x-best.pos.x, vz=dl.z-best.pos.z, l=Math.hypot(vx,vz)||1; tgt={x:best.pos.x+vx/l*0.75,z:best.pos.z+vz/l*0.75}; }
    }
    a.chasing=false;
    if(pl.role==='attack' && loose && S.kicked){ const ic=findIntercept(S,a,done?3.0:1.6); if(ic){ tgt=ic; a.chasing=true; } }
    return {tgt,mul};
  }
  if(a.role==='def'){
    const pl=a.plan; let range=3.0;
    if(pl.type==='mark'){
      const m=attackers[pl.target]; const lag=posAt(m.hist,S.t-0.3)||m.pos;
      const gx=GOAL_REF.x-lag.x, gz=GOAL_REF.z-lag.z, gl=Math.hypot(gx,gz)||1;
      tgt={x:lag.x+gx/gl*0.9,z:lag.z+gz/gl*0.9}; range=2.0;
    } else if(S.t>-0.5) tgt=pl.point;
    a.screened=attackers.some(t=>t.plan.role==='screen' && S.t>=TIMINGS[t.plan.timing].d && hyp(t.pos.x,t.pos.z,a.pos.x,a.pos.z)<1.2);
    if(a.screened) mul=0.45;
    a.chasing=false;
    if(loose && S.kicked && S.t>0.05){ const ic=findIntercept(S,a,range); if(ic){ tgt=ic; a.chasing=true; } }
    return {tgt,mul};
  }
  // keeper
  const claim=a.plan==='claim';
  tgt={x:clamp(b.x*0.06,-1.6,1.6),z:claim?1.3:0.7};
  if(loose && S.kicked){
    const ic=findIntercept(S,a,claim?4.5:1.5,p=>p.z<(claim?5.0:2.4)&&Math.abs(p.x)<(claim?7:4.5));
    if(ic){ tgt=ic; mul=1.1; }
  }
  if(S.kind==='shot' && S.shot){
    if(S.t>S.shot.t0+S.shot.react && S.shot.dive){ tgt={x:clamp(S.shot.cx,-GOAL_HW-0.5,GOAL_HW+0.5),z:a.pos.z}; mul=1.15; if(a.diveT<0){ a.diveT=0; a.diveSide=Math.sign(S.shot.cx-a.pos.x)||1; } }
    else if(S.t<=S.shot.t0+S.shot.react) mul=0;
  }
  return {tgt,mul};
}

function moveActor(a,tgt,mul,dt){
  const dx=tgt.x-a.pos.x, dz=tgt.z-a.pos.z, d=Math.hypot(dx,dz);
  const maxS=a.speed*mul; const ds=d>0.05?Math.min(maxS,d*3.5):0;
  let dvx=(d>1e-3?dx/d:0)*ds-a.vel.x, dvz=(d>1e-3?dz/d:0)*ds-a.vel.z;
  const acc=(a.role==='gk'&&mul>1.2?30:17)*dt, dl=Math.hypot(dvx,dvz);
  if(dl>acc){ dvx*=acc/dl; dvz*=acc/dl; }
  a.vel.x+=dvx; a.vel.z+=dvz; a.pos.x+=a.vel.x*dt; a.pos.z+=a.vel.z*dt;
}

function successProb(S,a){
  const b=S.ball, spd=Math.hypot(b.vx,b.vy,b.vz);
  if(a.role==='gk'){
    if(S.kind==='shot'){ const lat=S.shot?S.shot.lat0:1; return clamp(0.9-lat*0.16-Math.max(0,spd-13)*0.03,0.12,0.9); }
    let crowded=0; for(const t of attackers) if(hyp(t.pos.x,t.pos.z,a.pos.x,a.pos.z)<1.3) crowded++;
    return clamp(0.74-Math.max(0,spd-18)*0.02-crowded*0.28,0.2,0.82);
  }
  let p=a.team==='att'?0.86:0.8;
  p-=Math.max(0,spd-16)*0.03;
  if(b.y>a.reachH-0.3) p-=0.15;
  if(a.screened) p-=0.35;
  if(S.kind==='shot') p=clamp(0.55-Math.max(0,spd-12)*0.03,0.15,0.5);
  return clamp(p,0.1,0.95);
}

function onTargetCheck(path){
  for(const p of path){ if(p.z<=0){ return Math.abs(p.x)<GOAL_HW+0.25 && p.y<GOAL_H+0.25; } }
  return false;
}

function touch(S,a){
  const b=S.ball, r=S.rng, spd=Math.hypot(b.vx,b.vy,b.vz);
  const header=b.y>1.15;
  a.action=header?'header':(a.role==='gk'?'catch':'kick'); a.actT=0;
  if(header && a.jumpT<0) a.jumpT=0.05;
  if(a.role==='gk'){
    if(S.kind==='shot' && ((spd>19&&r()<0.45)||(Math.abs(b.x-a.pos.x)>0.9&&r()<0.5))){
      const sx=Math.sign(b.x-a.pos.x)||1;
      Object.assign(b,{vx:sx*(3+r()*4),vy:4+r()*3,vz:2.5+r()*3,spin:0});
      S.parried=true; newPhase(S,'loose',a); S.events.push({type:'touch',who:a,kind:'parry'}); return;
    }
    b.held=a; b.vx=b.vy=b.vz=0; b.spin=0; a.action='hold';
    const wasShot=S.kind==='shot'; newPhase(S,'held',a);
    S.events.push({type:'touch',who:a,kind:'catch'});
    setResult(S,wasShot?'saved':'claimed'); return;
  }
  if(a.team==='att'){
    const k=keeper.pos; let aimX=k.x>0.3?-2.8:(k.x<-0.3?2.8:(r()<0.5?-2.8:2.8));
    let aimY=header?0.3+r()*0.9:0.4+r()*1.4;
    const distG=Math.hypot(b.x,b.z);
    let nd=9; for(const d of defenders) nd=Math.min(nd,hyp(d.pos.x,d.pos.z,a.pos.x,a.pos.z));
    const sigma=(header?0.75:1.0)+spd*0.022+distG*0.055+(nd<1.3?0.55:0);
    aimX+=gauss(r)*sigma; aimY=Math.max(0.2,aimY+gauss(r)*sigma*0.45);
    let kind=header?'header':'volley';
    if(!header && r()<0.07){ Object.assign(b,{vx:gauss(r)*6,vy:8+r()*6,vz:3+r()*6,spin:0}); kind='shin'; }
    else { const sp=header?clamp(8+spd*0.4,11,18):21+r()*4; Object.assign(b,aimVelocity(b,{x:aimX,y:aimY,z:-0.3},sp)); b.spin=0; }
    newPhase(S,'shot',a);
    let cross=null; for(const p of S.pred){ if(p.z<=keeper.pos.z){ cross=p; break; } }
    const onT=onTargetCheck(S.pred); S.shotCount=(S.shotCount||0)+1; S.onT=(S.onT||0)+(onT?1:0);
    S.shot={t0:S.t,cx:cross?cross.x:b.x,cy:cross?cross.y:1,lat0:Math.abs((cross?cross.x:b.x)-keeper.pos.x),react:0.16+r()*0.16,onTarget:onT,dive:onT&&cross&&Math.abs(cross.x-keeper.pos.x)>0.25,by:a,kind};
    S.events.push({type:'touch',who:a,kind});
    return;
  }
  // defender
  if(header && r()<0.04){
    Object.assign(b,aimVelocity(b,{x:gauss(r)*2.6,y:0.6+r()*1.5,z:-0.3},14)); b.spin=0;
    newPhase(S,'shot',a); S.own=true;
    let cross=null; for(const p of S.pred){ if(p.z<=keeper.pos.z){ cross=p; break; } }
    const onT=onTargetCheck(S.pred);
    S.shot={t0:S.t,cx:cross?cross.x:b.x,cy:1,lat0:Math.abs((cross?cross.x:b.x)-keeper.pos.x),react:0.3+r()*0.15,onTarget:onT,dive:onT&&cross&&Math.abs(cross.x-keeper.pos.x)>0.25,by:a,kind:'own'};
    S.events.push({type:'touch',who:a,kind:'own'}); return;
  }
  const ang=(r()-0.5)*1.3, sp=15+r()*6;
  Object.assign(b,{vx:Math.sin(ang)*sp,vy:(header?5:7)+r()*4,vz:Math.cos(ang)*sp,spin:0});
  newPhase(S,'clear',a); S.events.push({type:'touch',who:a,kind:'clear'});
}

function setResult(S,code,extra={}){
  if(S.result) return;
  S.result={code,...extra}; S.endT=S.t+(code==='goal'?3.6:2.2);
  const good=code==='goal';
  S.leader=S.lastTouch&&S.lastTouch.team==='att'&&S.lastTouch.role!=='kicker'?S.lastTouch:kicker;
  if(good){
    S.leader.celebTo={x:S.leader.pos.x+9,z:S.leader.pos.z+7};
    for(const a of [kicker,...attackers]) a.mode='celebrate';
    for(const d of defenders) d.mode='sad'; keeper.mode='flop';
  } else if(['saved','claimed','cleared','mopped'].includes(code)){
    for(const a of [kicker,...attackers]) a.mode='facepalm';
    for(const d of defenders) d.mode='cheer'; if(code!=='saved'&&code!=='claimed') keeper.mode='cheer'; else keeper.mode='hold';
  } else {
    for(const a of [kicker,...attackers]) a.mode='facepalm';
    for(const d of defenders) d.mode='phew'; keeper.mode='phew';
  }
  S.events.push({type:'result'});
}

function simStep(S){
  const dt=DT; S.t+=dt; const b=S.ball, r=S.rng;
  // kick
  if(!S.kicked && S.t>=-0.12 && !kicker.action){ kicker.action='kick'; kicker.actT=0; }
  if(!S.kicked && S.t>=0){
    Object.assign(b,kickVel(Game_plan(S).kick)); S.kicked=true; newPhase(S,'cross',kicker); S.events.push({type:'kick'});
  }
  // attacker position history (used by markers' reaction lag)
  for(const a of attackers){ a.hist.push({t:S.t,x:a.pos.x,z:a.pos.z}); if(a.hist.length>150) a.hist.shift(); }
  // movement
  for(const a of everyone){
    const {tgt,mul,snap}=decideTarget(S,a);
    if(snap){ a.vel.set((tgt.x-a.pos.x)/dt,0,(tgt.z-a.pos.z)/dt); a.pos.x=tgt.x; a.pos.z=tgt.z; continue; }
    moveActor(a,tgt,mul,dt);
    if(a.chasing && a.jumpT<0 && !S.result){
      const dist3=Math.hypot(b.x-a.pos.x,b.z-a.pos.z);
      if(b.y>1.5 && dist3<2.2 && b.vy<2) a.jumpT=0;
    }
  }
  // separation
  for(let i=0;i<everyone.length;i++) for(let j=i+1;j<everyone.length;j++){
    const A=everyone[i],B=everyone[j]; if(A.mode==='flop'||B.mode==='flop') continue;
    const dx=B.pos.x-A.pos.x, dz=B.pos.z-A.pos.z, d=Math.hypot(dx,dz), min=0.36*(A.scale+B.scale);
    if(d<min&&d>1e-4){ const p=(min-d)/2/d; A.pos.x-=dx*p; A.pos.z-=dz*p; B.pos.x+=dx*p; B.pos.z+=dz*p; }
  }
  // ball
  if(b.held){ const k=b.held; b.x=k.pos.x; b.z=k.pos.z+0.45*k.scale; b.y=1.25*k.scale; }
  else if(S.kicked){
    const pz=b.z; const evs=[]; stepBall(b,dt,evs);
    for(const e of evs){ if(e.type==='post'||e.type==='bar'){ S.woodwork=true; if(S.kind==='shot'||S.kind==='cross') { S.pred=predictPath(b,S.t,3.5,4); } } S.events.push(e); }
    if(pz>=-BALL_R && b.z<-BALL_R && !b.inGoal && S.crossY===null) S.crossY=b.y;
  }
  // contacts
  if(S.kicked && !b.held && !S.result){
    const cands=[];
    for(const a of players){
      if(a.attempt===S.phaseId) continue;
      if(a===S.lastTouch && S.t-S.lastTouchT<0.5) continue;
      if(a.team==='att' && a.plan.role==='screen') continue;
      if(a.mode!=='play') continue;
      const hd=hyp(b.x,b.z,a.pos.x,a.pos.z);
      if(hd<a.reachR && b.y<a.reachH && !(a.role==='gk' && b.z>BOX_D)) cands.push({a,k:hd+r()*0.25});
    }
    cands.sort((x,y)=>x.k-y.k);
    for(const c of cands){
      c.a.attempt=S.phaseId;
      if(r()<successProb(S,c.a)){ touch(S,c.a); break; }
      S.events.push({type:'whiff',who:c.a});
      if(c.a.role!=='gk'){ c.a.action='whiff'; c.a.actT=0; }
    }
  }
  // outcomes
  if(!S.result){
    const lt=S.lastTouch;
    if(b.inGoal){ setResult(S,'goal',{scorer:lt,own:lt&&lt.team==='def',olimpico:lt===kicker,kind:S.shot?S.shot.kind:(lt===kicker?'direct':'')}); S.events.push({type:'goalFx'}); }
    else if(b.z<-BALL_R-0.05){
      if(lt&&lt.team==='def') setResult(S,'corner');
      else if(lt===kicker) setResult(S,'overhit');
      else setResult(S,(S.crossY!==null&&S.crossY>GOAL_H)?'over':'wide');
    }
    else if(Math.abs(b.x)>TOUCH_X+BALL_R) setResult(S,lt&&lt.team==='def'?'throwdef':'throw');
    else if(S.kind==='clear' && S.t-S.lastTouchT>1.1) setResult(S,'cleared',{by:lt});
    else if(S.t>9 || (S.kicked && S.t>1.5 && b.y<=BALL_R+0.01 && Math.hypot(b.vx,b.vz)<1.2)) setResult(S,'mopped');
  }
  if(S.result && S.t>S.endT) S.done=true;
}
let Game_plan=()=>Game.plan;

function updateRig(a,dt,bp){
  const R=a.rig, v=a.vis; v.t+=dt;
  const sp=Math.hypot(a.vel.x,a.vel.z);
  let want=v.yaw;
  if(a.mode!=='flop'&&a.mode!=='sad'){
    if(sp>0.7) want=Math.atan2(a.vel.x,a.vel.z);
    else if(bp) want=Math.atan2(bp.x-a.pos.x,bp.z-a.pos.z);
  }
  if(a.diveT>=0) want=v.yaw;
  v.yaw+=angDiff(want,v.yaw)*Math.min(1,dt*9);
  R.root.position.set(a.pos.x,0,a.pos.z); R.root.rotation.y=v.yaw;
  R.body.position.set(0,0,0); R.body.rotation.set(0,0,0); R.hips.position.y=0.62; R.head.rotation.x=0; R.head.rotation.z=0;
  const run=Math.min(1,sp/5);
  v.phase+=sp*dt*2.5;
  const sw=Math.sin(v.phase)*run;
  R.legs[0].rotation.set(sw*0.95,0,0); R.legs[1].rotation.set(-sw*0.95,0,0);
  R.arms.forEach((ap,i)=>ap.rotation.set((i?1:-1)*sw*0.8,0,ap.userData.s*(0.18+run*0.1)));
  let y=Math.abs(Math.cos(v.phase))*0.08*run;
  R.body.rotation.x=run*0.16;
  if(sp<0.3 && (a.mode==='idle'||a.mode==='play')){ y+=Math.max(0,Math.sin(v.t*4.5+v.seed))*0.035; R.arms.forEach(ap=>ap.rotation.z=ap.userData.s*(0.2+Math.sin(v.t*2+v.seed)*0.05)); }
  // jump
  if(a.jumpT>=0){ a.jumpT+=dt; const k=a.jumpT/0.6; if(k>=1) a.jumpT=-1; else { y+=4*k*(1-k)*0.6; R.arms.forEach(ap=>{ap.rotation.x=-2.6;ap.rotation.z=ap.userData.s*0.4}); R.legs[0].rotation.x=0.5; R.legs[1].rotation.x=-0.2; } }
  // actions
  if(a.action){
    a.actT+=dt; const k=a.actT/0.4, s=Math.sin(Math.min(1,k)*Math.PI);
    switch(a.action){
      case 'header': R.head.rotation.x=s*0.75; R.body.rotation.x+=s*0.35; break;
      case 'kick': R.legs[1].rotation.x=k<0.3?k/0.3*0.8:-Math.sin((k-0.3)/0.7*Math.PI)*1.8; R.arms[0].rotation.z=-0.9; R.arms[1].rotation.z=0.9; break;
      case 'catch': case 'hold': R.arms.forEach(ap=>{ap.rotation.x=-1.35;ap.rotation.z=-ap.userData.s*0.35}); break;
      case 'whiff': R.body.rotation.z=Math.sin(k*Math.PI*3)*0.25; R.head.rotation.z=Math.sin(k*Math.PI*4)*0.3; break;
    }
    if(k>=1 && a.action!=='hold') a.action=null;
  }
  // keeper dive
  if(a.diveT>=0){
    a.diveT+=dt; const k=Math.min(1,a.diveT/0.22), rec=a.diveT>1.3?Math.max(0,1-(a.diveT-1.3)/0.4):1;
    const localX=Math.cos(v.yaw)*a.diveSide; const side=Math.sign(localX)||1;
    R.body.rotation.z=-side*k*1.3*rec; y+=k*0.3*rec;
    R.arms.forEach(ap=>{ap.rotation.x=0;ap.rotation.z=ap.userData.s*2.6});
    if(a.diveT>1.7) a.diveT=-1;
  }
  // result moods
  const T=v.t+v.seed;
  switch(a.mode){
    case 'celebrate':
      if(sp>1.5 && a.isLeader){ R.arms.forEach(ap=>{ap.rotation.x=0;ap.rotation.z=ap.userData.s*1.45}); R.body.rotation.z=Math.sin(T*3)*0.2; }
      else { y+=Math.abs(Math.sin(T*7))*0.4; R.arms.forEach((ap,i)=>{ap.rotation.x=-2.8+Math.sin(T*14+i)*0.25;ap.rotation.z=ap.userData.s*0.35}); }
      break;
    case 'sad': R.hips.position.y=0.28; R.legs.forEach(l=>l.rotation.x=-1.45); R.head.rotation.x=0.5; R.arms.forEach(ap=>{ap.rotation.x=-0.25;ap.rotation.z=ap.userData.s*0.1}); y=0; R.body.rotation.x=-0.05; break;
    case 'flop': R.body.rotation.x=1.42; y=0.38; R.body.rotation.z=0; R.legs.forEach((l,i)=>l.rotation.x=Math.sin(T*9+i*2)*0.5); R.arms.forEach((ap,i)=>{ap.rotation.x=Math.sin(T*9+i)*0.4;ap.rotation.z=ap.userData.s*2.2}); break;
    case 'cheer': y+=Math.max(0,Math.sin(T*6))*0.25; R.arms[1].rotation.x=-2.7+Math.sin(T*12)*0.3; R.arms[1].rotation.z=0.2; break;
    case 'phew': R.arms.forEach(ap=>{ap.rotation.x=-0.6;ap.rotation.z=-ap.userData.s*0.2}); R.head.rotation.x=-0.1+Math.sin(T*2)*0.05; break;
    case 'facepalm': if(sp<1){ R.arms.forEach(ap=>{ap.rotation.x=-2.55;ap.rotation.z=-ap.userData.s*0.55}); R.head.rotation.x=-0.3; R.body.rotation.z=Math.sin(T*2.2)*0.06; } break;
  }
  R.body.position.y=y; v.y=y;
  if(bp && a.mode!=='flop' && a.mode!=='sad'){
    const wantH=clamp(angDiff(Math.atan2(bp.x-a.pos.x,bp.z-a.pos.z),v.yaw),-1,1);
    v.headYaw+=(wantH-v.headYaw)*Math.min(1,dt*6); R.head.rotation.y=v.headYaw;
  } else { v.headYaw*=0.9; R.head.rotation.y=v.headYaw; }
  R.blob.scale.set(1.3*a.scale*(1-Math.min(0.5,y*0.5)),1,1.3*a.scale*(1-Math.min(0.5,y*0.5)));
}

let trajLabels=[];
const _d=new THREE.Object3D();
function updateTraj(){
  const path=kickPath(Game.plan.kick,4.2,6);
  let n=0;
  for(const p of path){ if(n>=MAXD) break;
    _d.position.set(p.x,p.y,p.z); _d.updateMatrix(); trajDots.setMatrixAt(n,_d.matrix);
    trajDots.setColorAt(n,(p.y>0.35&&p.y<2.85)?GOLD:WHITE);
    _d.position.set(p.x,0.035,p.z); _d.updateMatrix(); shadowDots.setMatrixAt(n,_d.matrix); n++; }
  trajDots.count=shadowDots.count=n;
  trajDots.instanceMatrix.needsUpdate=shadowDots.instanceMatrix.needsUpdate=true; trajDots.instanceColor.needsUpdate=true;
  const d=deliveryPoint(path);
  deliveryRing.position.set(d.x,0.04,d.z); stalk.position.set(d.x,0,d.z);
  trajLabels.forEach(removeLabel); trajLabels=[];
  for(const p of path){ const q=p.t/0.5; if(p.t>0.2 && Math.abs(q-Math.round(q))<0.051 && !p.end){ const pos=new V3(p.x,p.y+0.35,p.z); trajLabels.push(addLabel(`${p.t.toFixed(1)}s`,'tick',()=>pos)); } }
  const dp=new V3(d.x,0.1,d.z);
  trajLabels.push(addLabel(`🎯 ${d.t.toFixed(1)}s`,'eta',()=>dp));
  Game.delivery=d;
}
function setTrajVisible(v){ trajGroup.visible=v; trajLabels.forEach(L=>L.visible=v); }

let planLabels=[];
function clearPlanGfx(){ while(planGroup.children.length){ const c=planGroup.children.pop(); if(c.material && c.material.userData.own) c.material.dispose(); } planLabels.forEach(removeLabel); planLabels=[]; }
function dotted(points,color,opacity=0.95){
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false}); mat.userData.own=true;
  let carry=0.3;
  for(let i=0;i<points.length-1;i++){
    const a=points[i],b=points[i+1],L=hyp(a.x,a.z,b.x,b.z); let s=carry;
    for(;s<L;s+=0.5){ const f=s/L; const m=new THREE.Mesh(discGeo,mat); m.position.set(lerp(a.x,b.x,f),0.04,lerp(a.z,b.z,f)); planGroup.add(m); }
    carry=s-L;
  }
  if(points.length>1){ const a=points[points.length-2],b=points[points.length-1]; const ar=new THREE.Mesh(arrowGeo,mat); ar.position.set(b.x,0.045,b.z); ar.rotation.y=Math.atan2(-(b.x-a.x),-(b.z-a.z)); planGroup.add(ar); }
  return mat;
}
function runLength(a,pl){ let L=0,p={x:a.pos.x,z:a.pos.z}; for(const w of pl.wps){ L+=hyp(p.x,p.z,w.x,w.z); p=w; } return L; }
function buildPlanGfx(){
  clearPlanGfx();
  const dr=Game.draft;
  if(dr && dr.actor!==kicker){ const mat=dotted([{x:dr.actor.pos.x,z:dr.actor.pos.z},dr.point],actorColor(dr.actor),0.6); }
  attackers.forEach((a,i)=>{
    const pl=Game.plan.att[i]; if(!pl.wps.length || (dr&&dr.actor===a)) return;
    const pts=[{x:a.pos.x,z:a.pos.z},...pl.wps];
    const mat=dotted(pts,a.cfg.color);
    const end=pl.wps[pl.wps.length-1];
    const ring=new THREE.Mesh(endRingGeo,mat); ring.position.set(end.x,0.045,end.z); planGroup.add(ring);
    const eta=TIMINGS[pl.timing].d+runLength(a,pl)/a.speed+0.3;
    const pos=new V3(end.x,0.1,end.z);
    planLabels.push(addLabel(`${pl.role==='screen'?'🧱':'⚡'} ${a.name.split(' ').pop()} ⏱ ${eta.toFixed(1)}s`,'eta" style="position:relative;border-color:'+a.cfg.color,()=>pos));
  });
  if(Game.plan.def && Game.revealed){
    defenders.forEach((d,i)=>{
      if(i>=Game.revealed) return;
      const pl=Game.plan.def.defs[i];
      if(pl.type==='mark'){ const t=attackers[pl.target]; dotted([{x:d.pos.x,z:d.pos.z},{x:t.pos.x,z:t.pos.z}],'#1f7f79',0.8); }
      else { const mat=dotted([{x:d.pos.x,z:d.pos.z},pl.point],'#1f7f79',0.8); const ring=new THREE.Mesh(new THREE.RingGeometry(1.8,2.0,40).rotateX(-Math.PI/2),mat); ring.position.set(pl.point.x,0.04,pl.point.z); planGroup.add(ring); }
    });
  }
}

// ---------- radial choice wheel ----------
const LOFTS=[{i:'🚄',l:'Driven',v:11},{i:'💨',l:'Whipped',v:18},{i:'🌈',l:'Lofted',v:26},{i:'🎈',l:'Floaty',v:35}];
const CURLS=[{i:'⤴️',l:'Out-swing',v:-0.5},{i:'⬆️',l:'Straight',v:0},{i:'⤵️',l:'In-swing',v:0.55}];
const ROLES=[{i:'⚡',l:'Attack ball',v:'attack'},{i:'🧱',l:'Block',v:'screen'}];
function etaFor(d,ti){ const a=d.actor; return TIMINGS[ti].d+hyp(a.pos.x,a.pos.z,d.point.x,d.point.z)/a.speed+0.3; }
const WHEELS={
  kicker:[
    {title:'Height',key:'loft',opts:()=>LOFTS},
    {title:'Curl',key:'curl',opts:()=>CURLS},
  ],
  att:[
    {title:'Job',key:'role',opts:()=>ROLES},

     opts:d=>TIMINGS.map((t,i)=>({i:['🐇','⚽','🐢'][i],l:t.label,v:i,e:'⏱ '+etaFor(d,i).toFixed(1)+'s'}))},

const wheelFor=a=>WHEELS[a===kicker?'kicker':'att'];
const pendingRing=new THREE.Mesh(new THREE.RingGeometry(0.55,0.8,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:0.95,depthWrite:false}));
pendingRing.position.y=0.05; pendingRing.visible=false; scene.add(pendingRing);

function draftKick(over={}){ const d=Game.draft; const k={...d.backup,...d.vals,...over}; solveAim(k,d.point.x,d.point.z); return k; }
function previewKick(over){ Object.assign(Game.plan.kick,draftKick(over)); updateTraj(); }
function currentVal(d,key){
  if(d.actor===kicker){ const list=key==='loft'?LOFTS:CURLS, cur=d.backup[key]; return list.reduce((b,o)=>Math.abs(o.v-cur)<Math.abs(b.v-cur)?o:b).v; }
  if(!Game.planned.has(d.actor)) return undefined;
  return Game.plan.att[attackers.indexOf(d.actor)][key];
}
function openWheel(actor,point,sx,sy){
  Game.draft={actor,point,step:0,vals:{},backup:{...Game.plan.kick},sx,sy};
  controls.enabled=false; hoverRing.visible=false;
  pendingRing.visible=true; pendingRing.position.set(point.x,0.05,point.z); pendingRing.material.color.set(actorColor(actor));
  if(actor===kicker) previewKick();
  buildPlanGfx(); renderWheel(); updateHint(); Sfx.pop();
}
function renderWheel(){
  const d=Game.draft, steps=wheelFor(d.actor), st=steps[d.step], opts=st.opts(d);
  const n=opts.length, R=n>3?96:88, a0=n===2?Math.PI:-Math.PI/2;
  let best=-1;
  if(st.key==='timing' && d.vals.role==='attack' && Game.delivery){ let bd=1e9; opts.forEach((o,i)=>{ const diff=Math.abs(etaFor(d,i)-Game.delivery.t); if(diff<bd){bd=diff;best=i;} }); }
  const cur=currentVal(d,st.key);
  const dots=steps.map((_,i)=>i<=d.step?'●':'○').join(' ');
  radial.innerHTML=`<div class="rbg"></div><button class="rcenter" title="Cancel"><span class="t">${st.title}</span><span class="s">${st.sub?st.sub(d):dots}</span><span class="x">✕ cancel</span></button>`+
    opts.map((o,i)=>{ const a=a0+i*2*Math.PI/n; return `<button class="ropt ${i===best?'best':''} ${o.v===cur?'cur':''}" data-i="${i}" style="--x:${(Math.cos(a)*R).toFixed(1)}px;--y:${(Math.sin(a)*R).toFixed(1)}px;animation-delay:${i*40}ms"><span class="i">${o.i}</span><span class="l">${o.l}</span>${o.e?`<span class="e">${o.e}</span>`:''}</button>`; }).join('');
  const m=R+48, x=clamp(d.sx,m,innerWidth-m), y=clamp(d.sy,m+56,innerHeight-m-80);
  radial.style.transform=`translate(${x}px,${y}px)`; radial.classList.add('open');
  radial.querySelector('.rcenter').onclick=()=>{ Sfx.pop(); cancelWheel(); };
  radial.querySelectorAll('.ropt').forEach(b=>{ const o=opts[+b.dataset.i];
    b.onclick=()=>chooseOption(st,o);
    if(d.actor===kicker){ b.onpointerenter=()=>previewKick({[st.key]:o.v}); b.onpointerleave=()=>{ if(Game.draft) previewKick(); }; }
  });
}
function chooseOption(st,o){
  Sfx.pop(); const d=Game.draft; d.vals[st.key]=o.v; d.step++;
  if(d.step<wheelFor(d.actor).length){ if(d.actor===kicker) previewKick(); renderWheel(); updateHint(); return; }
  commitDraft();
}
function commitDraft(){
  const d=Game.draft, a=d.actor;
  if(a===kicker){ Object.assign(Game.plan.kick,draftKick()); updateTraj(); }
  else Game.plan.att[attackers.indexOf(a)]={wps:[{x:d.point.x,z:d.point.z}],role:d.vals.role,timing:d.vals.timing};
  Game.planned.add(a); closeWheel();
  say(a,pick(Math.random,a===kicker?['On it!','Lovely.','Watch this.']:['Got it, gaffer!','On my way!','Leave it to me.']),'att',1.3);
  select(OWN.find(p=>!Game.planned.has(p))||null);
}
function cancelWheel(){ const d=Game.draft; if(!d) return; if(d.actor===kicker){ Object.assign(Game.plan.kick,d.backup); updateTraj(); } closeWheel(); }
function closeWheel(){ Game.draft=null; radial.classList.remove('open'); radial.innerHTML=''; pendingRing.visible=false; controls.enabled=true; buildPlanGfx(); renderDock(); updateHint(); }
addEventListener('keydown',e=>{ if(e.key==='Escape') cancelWheel(); });

// ---------- selection, hint, dock ----------
function select(a){

  if(a===kicker){ if(Game.camMode!==0) setView(0); }
  else if(a && Game.camMode===0) setView(1);

}
function updateHint(){
  if(Game.phase!=='plan') return;
  const a=Game.selActor, d=Game.draft;
  if(d) setHint(d.actor===kicker?'How should <b>Sue</b> strike it?':`Pick <b>${shortName(d.actor)}</b>'s move`);
  else if(a===kicker) setHint('👆 Tap where <b>Sue</b> should send the ball');

}
function planSummary(a){
  if(a===kicker){ const k=Game.plan.kick; return Game.planned.has(a)?`${loftWord(k.loft)} · ${curlWord(k.curl)}`:'tap to aim'; }
  if(!Game.planned.has(a)) return 'stays put';

function renderDock(){
  const P=Game.phase;
  if(P==='plan'){
    dock.innerHTML=OWN.map((a,i)=>`<button class="rp ${Game.selActor===a?'sel':''} ${Game.planned.has(a)?'done':''}" data-i="${i}" title="${a.cfg.blurb}">

      `<span class="dsep"></span><button class="btn go" id="ready">Ready ▶</button>`;
    dock.querySelectorAll('.rp').forEach(b=>b.onclick=()=>{ Sfx.pop(); select(OWN[+b.dataset.i]); });

    $('#backPlan').onclick=()=>{ Sfx.pop(); clearTimers(); Game.plan.def=null; Game.revealed=0; goPlan(); select(null); };

function updateTags(){

    if(!a.tag){
      const off=new V3(); a.tag=addLabel('','tag',()=>a.head(off)); a.tag.owner=a;

// ---------- phase flow ----------
function placeAtStarts(){
  const s=Game.starts;
  attackers.forEach((a,i)=>a.pos.set(s.att[i].x,0,s.att[i].z));
  defenders.forEach((a,i)=>a.pos.set(s.def[i].x,0,s.def[i].z));
  keeper.pos.set(s.gk.x,0,s.gk.z); kicker.pos.set(KICKER_START.x,0,KICKER_START.z);
  for(const a of everyone){ a.vel.set(0,0,0); a.mode='idle'; a.action=null; a.jumpT=-1; a.diveT=-1; }
  Object.assign(ballState,makeBall());
}
const ballState=makeBall();

function startRound(){
  clearTimers(); hideBanner(); $('#replayTag').style.display='none';
  crowd.target=0.08; confetti.length=0; confMesh.count=0;
  const r=mulberry32(Game.round*7919+(Math.random()*1000|0));
  Game.starts=makeStarts(r);
  const kick=Game.plan?Game.plan.kick:freshKick();
  if(!Game.plan){ solveAim(kick,0.5,7.5); }
  Game.plan={kick,att:[0,1,2].map(()=>({wps:[],timing:1,role:'attack'})),def:null,seed:(Math.random()*1e9)|0};
  Game.revealed=0; Game.planned=new Set();
  placeAtStarts(); updateScore();
  goPlan(); Game.camMode=-1; select(kicker);
}
function goPlan(){
  Game.phase='plan'; clearTimers(); controls.enabled=true;
  setTrajVisible(true); updateTraj(); buildPlanGfx(); renderDock(); updateTags(); updateHint();
}
function goCpu(){
  cancelWheel();
  Game.phase='cpu'; hoverRing.visible=false; updateTags(); renderDock();
  setHint('The CPU is setting up its defence…');
  if(Game.camMode===0) setView(1);
  const r=mulberry32(Game.plan.seed^0x5bd1e995);
  Game.plan.def=cpuPlan(r,Game.starts,Game.plan.kick); Game.revealed=0; buildPlanGfx();
  const D=Game.plan.def;
  const styleName={man:'man-to-man',mixed:'markers + a zone',zonal:'zonal'}[D.style];
  const lines={mark:t=>pick(r,[`I've got ${t}!`,`Sticking to ${t} like glue.`,`${t}? Easy.`]),zone:z=>pick(r,[`${z[0].toUpperCase()+z.slice(1)} is mine.`,`Guarding ${z}.`,`Nobody gets past me at ${z}.`])};
  later(500,()=>{ const s=$('#cpuStyle'); if(s) s.textContent=styleName; Sfx.pop(); });
  defenders.forEach((d,i)=>later(1100+i*800,()=>{
    const pl=D.defs[i]; Game.revealed=i+1; buildPlanGfx(); Sfx.pop();
    say(d,pl.type==='mark'?lines.mark(attackers[pl.target].name):lines.zone(pl.zoneName),'def',2.6);
  }));
  later(1100+3*800,()=>{ say(keeper,D.keeper==='claim'?"I'm coming for everything!":'Staying on my line, thanks.','def',2.6); Sfx.pop(); });
  later(1100+4*800,()=>{ const b=$('#play'); if(b){ b.disabled=false; b.classList.add('pulse'); } const th=$('#think'); if(th) th.remove(); setHint('Defence is ready — hit <b>Play</b>!'); });
}

function play(isReplay){
  clearTimers(); hideBanner(); cancelWheel();
  Game.phase='sim'; Game.replay=isReplay;
  setTrajVisible(false); clearPlanGfx(); hoverRing.visible=false; updateTags(); renderDock();
  setHint(isReplay?'↺ Replay':'');
  crowd.target=0.15; confetti.length=0; confMesh.count=0;
  Game.sim=newSim(Game.plan,Game.starts,Game.plan.seed); Game.acc=0;
  camLook.copy(controls.target);
  controls.enabled=false; camTween=null;
  $('#replayTag').style.display=isReplay?'block':'none';
  if(!isReplay) Sfx.whistle();
  later(400,()=>say(kicker,pick(Math.random,['Here it comes!','One for the scrapbook…','Heads up, lads!']),'att',1.4));
}

  throw:{e:'🙈',title:'OUT OF PLAY',cls:'bad'},
  throwdef:{e:'🙈',title:'OUT OF PLAY',cls:'bad'},
  mopped:{e:'🧹',title:'SCRAMBLED AWAY',cls:'bad'},
};
function resultLine(S){
  const R=S.result, lt=S.lastTouch;
  switch(R.code){
    case 'goal':
      if(R.olimpico) return 'Straight in from the corner! Curly Sue, you absolute legend.';
      if(R.own) return `Own goal! ${R.scorer.name} will not be hearing the end of this.`;
      if(R.scorer===keeper) return 'Butterfingers! Stan fumbles it into his own net.';
      return `${R.scorer.name} with a ${R.kind==='header'?'thumping header':R.kind==='shin'?'…shin? It counts!':'crisp volley'}!${S.woodwork?' In off the woodwork!':''}`;
    case 'saved': return `${S.shot&&S.shot.by?S.shot.by.name+"'s effort":'The shot'} is gobbled up by Stan.`;
    case 'claimed': return 'Stan plucks the cross out of the sky. Smug.';
    case 'cleared': return `${lt?lt.name:'The defence'} hoofs it to safety.`;
    case 'wide': return S.woodwork?'DOINK! Off the woodwork and away!':`${lt?lt.name:'He'} drags it just wide.`;
    case 'over': return S.woodwork?'Clattered the bar and over!':`${lt?lt.name:'He'} sends it into row Z. The pies are safe.`;
    case 'corner': return S.parried?'Stan tips it round the post — go again!':'Deflected behind — go again!';
    case 'overhit': return 'Nobody got near it. Sue blames the wind.';
    case 'throw': case 'throwdef': return 'The ball rolls out for a throw-in.';
    case 'mopped': return 'A scramble… and the defence mops it up.';
  }
  return '';
}

function finishSim(){
  const S=Game.sim; Game.phase='result'; controls.enabled=true;
  controls.target.copy(camLook);
  const R=S.result, info=RESULT_TEXT[R.code];
  if(!Game.replay){
    Game.history.push({e:R.code==='goal'?'⚽':R.code==='corner'?'🔁':'·',t:info.title});
    if(R.code==='goal') Game.goals++;
    updateScore();
  }
  later(600,hideBanner); setHint(''); renderDock();
}

function handleEvents(S){
  for(const e of S.events){
    switch(e.type){
      case 'kick': Sfx.kick(1); break;
      case 'bounce': Sfx.tap(e.speed); break;
      case 'post': case 'bar': Sfx.boing(); sayAt(new V3(S.ball.x,S.ball.y+0.6,S.ball.z),'DOINK!'); Sfx.ooh(); break;
      case 'net': world.net.hit={x:e.x,y:e.y-GOAL_H/2,amp:Math.min(0.9,e.power*0.06),t:0}; break;
      case 'sidenet': sayAt(new V3(S.ball.x,1.5,S.ball.z),'Side netting!','boom',1.6); Sfx.ooh(); break;
      case 'whiff': say(e.who,pick(Math.random,['Whiff!','Oops!','Where\'d it go?','Uh oh']),'',1.2); break;
      case 'touch': {
        const w=e.who;
        const txt={header:['BONK!','Noggin!','Boing!','Head-tastic!'],volley:['WHACK!','Hit it!','Yeet!'],shin:['Shinned it!'],clear:['Nope!','Away!','Not today!','Hoof!'],catch:['Mine!','Got it!','Easy peasy.'],parry:['Tipped it!','Not on my watch!'],own:['Uh oh…','Wrong way!']}[e.kind];
        say(w,pick(Math.random,txt),w.team,1.6);
        Sfx.kick(e.kind==='header'?0.6:0.9);
        if(e.kind==='header'||e.kind==='volley'||e.kind==='shin'||e.kind==='own') { crowd.target=0.5; Sfx.swell(0.45,0.5,1.2); }
        break; }
      case 'goalFx': Sfx.cheer(); Sfx.whistle(0.25); crowd.target=1.1; burstConfetti(); if(S.leader) S.leader.isLeader=true; break;
      case 'result': {
        const R=S.result, info=RESULT_TEXT[R.code];
        showBanner(info.title,resultLine(S),info.cls);
        if(R.code!=='goal'){ crowd.target=0.1; if(['wide','over','corner','saved'].includes(R.code)) Sfx.ooh(); else Sfx.swell(0.25,0.3,1); }
        if(R.code==='goal'){ for(const a of attackers) if(a!==S.leader) later(300+rnd()*600,()=>say(a,pick(Math.random,['GET IN!','WOOO!','Mum, I\'m on telly!','Yessss!']),'att',1.8)); later(500,()=>say(keeper,'Oh come ON…','def',2)); }
        if(R.code==='saved'||R.code==='claimed') later(400,()=>say(keeper,pick(Math.random,['Too easy.','Safe hands, baby!','Tea, anyone?']),'def',2));
        break; }
    }
  }
  S.events.length=0;
}

// =====================================================================
//  Pointer
// =====================================================================
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), groundPlane=new THREE.Plane(new V3(0,1,0),0), _hit=new V3();
function groundPoint(e){ const r=renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera); return ray.ray.intersectPlane(groundPlane,_hit)?_hit.clone():null; }
let down=null;
const _f=new V3(), _h=new V3();
function toScreen(v){ return {x:(v.x*0.5+0.5)*innerWidth,y:(-v.y*0.5+0.5)*innerHeight,z:v.z}; }
function pickOwn(e){
  let best=null,bd=1e9;
  for(const a of OWN){
    const f=toScreen(_f.set(a.pos.x,0,a.pos.z).project(camera)), h=toScreen(_h.set(a.pos.x,2.1*a.scale,a.pos.z).project(camera));
    if(f.z>1) continue;
    const dx=h.x-f.x, dy=h.y-f.y, L2=dx*dx+dy*dy||1, t=clamp(((e.clientX-f.x)*dx+(e.clientY-f.y)*dy)/L2,0,1);
    const d=Math.hypot(e.clientX-(f.x+dx*t),e.clientY-(f.y+dy*t)), thr=Math.max(16,Math.sqrt(L2)*0.35);
    if(d<thr&&d<bd){ bd=d; best=a; }
  }
  return best;
}
renderer.domElement.addEventListener('pointerdown',e=>{ Sfx.init(); down={x:e.clientX,y:e.clientY,t:performance.now()}; });
renderer.domElement.addEventListener('pointermove',e=>{
  const cv=renderer.domElement;
  if(Game.phase!=='plan'||Game.draft){ hoverRing.visible=false; cv.style.cursor=''; return; }
  if(pickOwn(e)){ hoverRing.visible=false; cv.style.cursor='pointer'; return; }
  cv.style.cursor=Game.selActor?'crosshair':'';
  const p=Game.selActor&&groundPoint(e); if(!p){ hoverRing.visible=false; return; }
  hoverRing.visible=true; hoverRing.position.set(p.x,0.05,p.z); hoverRing.material.color.set(actorColor(Game.selActor));
});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); const dt=performance.now()-down.t; down=null;
  if(moved>6||dt>600||e.button!==0) return;
  if(Game.draft){ cancelWheel(); return; }
  if(Game.phase!=='plan') return;
  const hit=pickOwn(e); if(hit){ Sfx.pop(); select(hit); return; }
  if(!Game.selActor){ setHint('👆 Pick a player first — tap them or their name below'); return; }
  const p=groundPoint(e); if(!p) return;
  openWheel(Game.selActor,{x:clamp(p.x,-33,33),z:clamp(p.z,0.4,34)},e.clientX,e.clientY);
});
$('#camBtn').onclick=()=>{ Sfx.init(); if(Game.phase==='sim'||Game.draft) return; setView((Game.camMode+1)%VIEWS.length); const prev=hintEl.innerHTML; setHint('🎥 '+VIEWS[Game.camMode].name); setTimeout(()=>{ if(Game.phase==='plan') updateHint(); else setHint(prev); },1400); };
$('#muteBtn').onclick=()=>{ Sfx.init(); $('#muteBtn').textContent=Sfx.toggle()?'🔇':'🔊'; };
function fitView(){
  const W=innerWidth,H=innerHeight; camera.aspect=W/H; camera.clearViewOffset();
  camera.updateProjectionMatrix(); renderer.setSize(W,H);
  if(Game.draft) renderWheel();
}
addEventListener('resize',fitView); fitView();

// =====================================================================
//  Main loop
// =====================================================================
const clock=new THREE.Clock(); let time=0;
const _bp=new V3(), _look=new V3(), _cp=new V3();
function simCamera(S,dt){
  const b=S.ball;
  if(Game.replay){ _cp.set(clamp(b.x*0.3,-4,6),3.4,-6.4); _look.set(b.x,Math.max(0.8,b.y*0.6),b.z); }
  else if(S.t<0.1){ _cp.set(39.5,3.6,-3.2); _look.set(18,1.5,6); }
  else if(S.result&&S.result.code==='goal'&&S.leader&&S.t>S.endT-3.2){ const L=S.leader; _look.set(L.pos.x,1.2,L.pos.z); _cp.set(L.pos.x+4,3.5,L.pos.z+9); }
  else { _look.set(lerp(b.x,0,0.4),Math.min(b.y,4)*0.45,lerp(b.z,5,0.4)); _cp.set(_look.x*0.55+5,11,_look.z+19); }
  const k1=1-Math.exp(-dt*3.2), k2=1-Math.exp(-dt*5);
  camera.position.lerp(_cp,k1); camLook.lerp(_look,k2); camera.lookAt(camLook);
}
function animate(){
  if(FIXED) setTimeout(animate,16); else requestAnimationFrame(animate);
  const dt=FIXED?1/30:Math.min(clock.getDelta(),0.05); time+=dt;
  let vdt=dt;
  const S=Game.sim;
  if(Game.phase==='sim'&&S){
    // slow-mo when a contest is imminent
    let ts=1;
    if(S.kicked&&!S.result&&!S.ball.held){ for(const a of players){ if(a.mode!=='play') continue; const d=Math.hypot(S.ball.x-a.pos.x,S.ball.y-1.6,S.ball.z-a.pos.z); if(d<2.3){ ts=0.35; break; } } }
    if(S.result&&S.result.code==='goal'&&S.t<S.endT-2.6) ts=0.5;
    S.timeScale+=(ts-S.timeScale)*Math.min(1,dt*8);
    vdt=dt*S.timeScale;
    Game.acc+=vdt;
    while(Game.acc>=DT && !S.done){ simStep(S); Game.acc-=DT; }
    handleEvents(S);
    simCamera(S,dt);
    Object.assign(ballState,S.ball);
    if(S.done) finishSim();
  } else if(Game.phase==='result'&&S){
    // keep the celebration going
    for(const a of everyone){ const {tgt,mul}=decideTarget(S,a); moveActor(a,tgt,mul,dt); }
    if(!S.ball.held){ stepBall(S.ball,dt,null); } else { const k=S.ball.held; S.ball.x=k.pos.x; S.ball.z=k.pos.z+0.45*k.scale; S.ball.y=1.25*k.scale; }
    Object.assign(ballState,S.ball);
  }
  // camera
  if(camTween){ camTween.k+=dt/camTween.dur; const e=camTween.k>=1?1:(1-Math.cos(Math.PI*camTween.k))/2; camera.position.lerpVectors(camTween.p0,camTween.p1,e); controls.target.lerpVectors(camTween.t0,camTween.t1,e); if(camTween.k>=1) camTween=null; }
  if(controls.enabled) controls.update();
  // ball visuals
  const pb=ballMesh.position.clone();
  ballMesh.position.set(ballState.x,ballState.y,ballState.z);
  const mv=ballMesh.position.clone().sub(pb); mv.y=0; const ml=mv.length();
  if(ml>1e-4&&ml<3) ballMesh.rotateOnWorldAxis(new V3(mv.z,0,-mv.x).normalize(),ml/BALL_R);
  ballBlob.position.set(ballState.x,0.025,ballState.z); const bs=Math.max(0.35,0.75-ballState.y*0.06); ballBlob.scale.set(bs,1,bs); ballBlob.material.opacity=Math.max(0.2,0.9-ballState.y*0.08);
  _bp.set(ballState.x,ballState.y,ballState.z);
  for(const a of everyone) updateRig(a,vdt,_bp);
  // selection ring
  if(Game.phase==='plan'&&Game.selActor){ const a=Game.selActor; selRing.visible=true; selRing.position.set(a.pos.x,0.045,a.pos.z); selRing.material.color.set(actorColor(a)); const s=1+Math.sin(time*5)*0.08; selRing.scale.set(s,1,s); } else selRing.visible=false;
  if(pendingRing.visible){ const s=1+Math.sin(time*7)*0.12; pendingRing.scale.set(s,1,s); }
  // ambient
  updateCrowd(time,dt); updateConfetti(dt);
  for(const f of world.flags){ const arr=f.flag.geometry.attributes.position.array; for(let i=0;i<arr.length;i+=3){ const x=f.base[i]; arr[i+2]=Math.sin(time*5+x*8)*0.06*x*2; } f.flag.geometry.attributes.position.needsUpdate=true; f.fg.rotation.y=Math.sin(time*0.7)*0.4+0.3; }
  for(const c of world.clouds){ c.c.position.x+=c.s*dt; if(c.c.position.x>220) c.c.position.x=-220; }
  const N=world.net; if(N.hit){ N.hit.t+=dt; const h=N.hit; const A=h.amp*Math.exp(-h.t*3)*Math.cos(h.t*9); const arr=N.mesh.geometry.attributes.position.array; for(let i=0;i<arr.length;i+=3){ const dx=N.base[i]-h.x, dy=N.base[i+1]-h.y; arr[i+2]=-Math.max(0,A)*Math.exp(-(dx*dx+dy*dy)/0.7)-Math.max(0,-A)*0; } N.mesh.geometry.attributes.position.needsUpdate=true; if(h.t>2.5){ N.hit=null; arr.set?0:0; N.mesh.geometry.attributes.position.array.set(N.base); N.mesh.geometry.attributes.position.needsUpdate=true; } }
  if(trajGroup.visible){ deliveryRing.scale.setScalar(1+Math.sin(time*4)*0.08); }
  renderer.render(scene,camera);
  updateLabels(dt);
}

// debug: step the sim to time T, render once and dump the canvas as a data URL
function snapAt(T){
  const S=Game.sim; Game.phase='debug';
  while(S.t<T && !S.done){ simStep(S); for(const a of everyone) updateRig(a,DT,new V3(S.ball.x,S.ball.y,S.ball.z)); simCamera(S,DT); updateConfetti(DT); if(S.events.some(e=>e.type==='goalFx')) burstConfetti(); S.events.length=0; }
  Object.assign(ballState,S.ball); ballMesh.position.set(S.ball.x,S.ball.y,S.ball.z); ballBlob.position.set(S.ball.x,0.025,S.ball.z);
  updateCrowd(T,0.1); renderer.render(scene,camera);
  const o=$('#out'); o.style.display='block'; o.textContent=renderer.domElement.toDataURL('image/png'); document.title='SNAP '+S.t.toFixed(2)+' '+(S.result?S.result.code:'');
}

// =====================================================================
//  Autotest (balance): ?autotest=300
// =====================================================================
const SMART=new URLSearchParams(location.search).get('smart');
function smartPlan(r){
  const kick=freshKick(); const p=PRESETS[Math.floor(r()*4)]; kick.loft=p.loft; kick.curl=p.curl; solveAim(kick,p.x+gauss(r),p.z+gauss(r));
  const d=deliveryPoint(kickPath(kick));
  const order=[0,1,2].sort(()=>r()-0.5);
  const att=[null,null,null];
  order.forEach((ai,j)=>{ const a=CAST.att[ai]; const st=Game.starts.att[ai];
    if(j===0){ const dist=hyp(st.x,st.z,d.x,d.z); let timing=1; const t0=d.t-dist/a.speed-0.3; timing=t0<-0.3?0:t0>0.4?2:1; att[ai]={wps:[{x:d.x+0.4,z:d.z+0.3}],timing,role:'attack'}; }
    else if(j===1) att[ai]={wps:[{x:d.x+gauss(r)*1.5,z:d.z+2+gauss(r)}],timing:1,role:r()<0.5?'screen':'attack'};
    else att[ai]={wps:[{x:d.x-2.5+gauss(r),z:d.z+1.5+gauss(r)}],timing:1,role:'attack'};
  });
  return {kick,att,def:null,seed:(r()*1e9)|0};
}
function randomPlan(r){
  const kick=freshKick(); kick.loft=14+r()*22; kick.curl=-0.3+r()*1.1;
  const tx=-6+r()*12, tz=2+r()*12; solveAim(kick,tx,tz);
  const d=deliveryPoint(kickPath(kick));
  const att=[0,1,2].map(i=>({wps:[{x:d.x+gauss(r)*2.5,z:Math.max(0.5,d.z+gauss(r)*2.5)}],timing:Math.floor(r()*3),role:r()<0.2?'screen':'attack'}));
  return {kick,att,def:null,seed:(r()*1e9)|0};
}
async function runAutotest(){
  const r=mulberry32(1234), out={}; let goals=0;
  for(let i=0;i<AUTOTEST;i++){
    Game.starts=makeStarts(r); Game.plan=SMART?smartPlan(r):randomPlan(r); Game.plan.def=cpuPlan(r,Game.starts,Game.plan.kick);
    const S=newSim(Game.plan,Game.starts,Game.plan.seed); let g=0;
    while(!S.done&&g++<3000){ simStep(S); S.events.length=0; }
    const c=S.result?S.result.code:'none'; out[c]=(out[c]||0)+1; if(c==='goal') goals++;
    if(S.shotCount){ out.shots=(out.shots||0)+S.shotCount; out.onTarget=(out.onTarget||0)+S.onT; }
    out['kp_'+Game.plan.def.keeper+'_'+c]=(out['kp_'+Game.plan.def.keeper+'_'+c]||0)+1;
    if(S.touches>1){ const k=S.lastTouch?S.lastTouch.role:''; out['lastTouch_'+k]=(out['lastTouch_'+k]||0)+1; }
  }
  out.goalRate=(goals/AUTOTEST).toFixed(3);
  $('#out').style.display='block'; $('#out').textContent=JSON.stringify(out,null,1);
  document.title='DONE';
}

// =====================================================================
//  Boot
// =====================================================================
camera.position.set(...VIEWS[0].pos); controls.target.set(...VIEWS[0].tgt);
document.fonts.load('700 40px Fredoka').finally(()=>{
  if(AUTOTEST){ runAutotest(); return; }
  startRound();
  setTimeout(()=>{ $('#loading').classList.add('gone'); setTimeout(()=>$('#loading').remove(),900); },250);
  animate();
  // debug: ?stage=runs|cpu|sim&view=N
  const qs=new URLSearchParams(location.search), stage=qs.get('stage');
  if(stage==='flow'){ // scripted end-to-end check of the planning UI
    const log=[]; const out=$('#out'); out.style.display='block';
    addEventListener('error',e=>{ log.push('ERR '+e.message); out.textContent=log.join('\n'); });
    setTimeout(()=>{ try{
      const pts=[{x:0.5,z:9},{x:1,z:8},{x:4,z:3.5},{x:-3,z:5}];
      OWN.forEach((a,i)=>{ select(a); openWheel(a,pts[i],600,400); for(const st of wheelFor(a)){ const o=st.opts(Game.draft); chooseOption(st,o[i%o.length]); } });
      log.push('planned:'+Game.planned.size+' sel:'+(Game.selActor?Game.selActor.name:'none')+' dock:'+dock.querySelectorAll('.rp.done').length);
      log.push('plans:'+JSON.stringify(Game.plan.att.map(p=>[p.role,p.timing,p.wps.length]))+' kick:'+JSON.stringify(Game.plan.kick));
      select(attackers[1]); openWheel(attackers[1],{x:9,z:9},100,100); cancelWheel(); log.push('after cancel wps:'+JSON.stringify(Game.plan.att[1].wps));
      goCpu();
      setTimeout(()=>{ log.push('cpu def:'+Game.plan.def.style+' playEnabled:'+!$('#play').disabled); $('#play').click(); $('#skip').click();
        setTimeout(()=>{ log.push('phase:'+Game.phase+' result:'+Game.sim.result.code+' dockBtns:'+dock.querySelectorAll('button').length);
          $('#replay').click(); log.push('replay phase:'+Game.phase); $('#skip').click();
          setTimeout(()=>{ $('#next').click(); log.push('next: phase '+Game.phase+' round '+Game.round+' sel '+Game.selActor.name+' planned '+Game.planned.size); log.push('FLOW OK'); out.textContent=log.join('\n'); },500);
        },500);
      },5000);
    }catch(e){ log.push('EXC '+e.stack); out.textContent=log.join('\n'); } },1200); }
  if(stage==='wheel'){ const a=OWN[+(qs.get('who')||0)]; select(a); setTimeout(()=>{ camTween=null; const v=VIEWS[a===kicker?0:1]; camera.position.set(...v.pos); controls.target.set(...v.tgt); controls.update(); camera.updateMatrixWorld(); openWheel(a,a===kicker?{x:0.5,z:9}:{x:2,z:6},innerWidth*0.5,innerHeight*0.5); if(qs.get('step')) chooseOption(wheelFor(a)[0],wheelFor(a)[0].opts(Game.draft)[0]); },1500); }
  else if(stage){
    Game.plan.att[0]={wps:[{x:1,z:7}],timing:1,role:'attack'}; Game.plan.att[1]={wps:[{x:3.5,z:3.5}],timing:0,role:'attack'}; Game.plan.att[2]={wps:[{x:-2,z:6}],timing:1,role:'screen'};
    OWN.forEach(a=>Game.planned.add(a)); select(null);
    if(stage==='cpu'||stage==='sim') goCpu();
    if(stage==='sim') setTimeout(()=>{
      if(QS.get('want')){ // search for a seed that produces the wanted result
        for(let sd=1;sd<800;sd++){ const S=newSim(Game.plan,Game.starts,sd); let g=0; while(!S.done&&g++<3000){ simStep(S); S.events.length=0; } if(S.result.code===QS.get('want')){ Game.plan.seed=sd; break; } }
      }
      play(false);
      if(QS.get('snap')) snapAt(parseFloat(QS.get('snap')));
    },5200);
  }
  if(qs.get('view')) setTimeout(()=>{ camTween=null; const v=VIEWS[+qs.get('view')]; camera.position.set(...v.pos); controls.target.set(...v.tgt); },1500);
});
